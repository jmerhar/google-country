name: Release

# Releases are cut from version tags only. (No workflow_dispatch: without a tag the GitHub Release
# step has no tag to publish and would fail.)
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and push the Pages branch
    # Only the two real secrets are needed; the item/publisher IDs are committed in cws.json.
    env:
      CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
      CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # The tag must match the package version so the artifacts are labelled correctly.
      - name: Verify tag matches version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          test "$tag" = "$VERSION" || { echo "Tag v$tag != package.json $VERSION"; exit 1; }

      # Release notes come from the CHANGELOG section for this version (fails if missing).
      - name: Extract release notes
        run: node scripts/release-notes.mjs "$VERSION" > RELEASE_NOTES.md

      # Don't publish a release from a red commit (the tag and CI run concurrently otherwise).
      - name: Lint, type-check & test
        run: |
          npm run lint
          npm run typecheck
          npm run test

      - name: Build extension
        run: npm run build

      - name: Package zip
        run: (cd dist && zip -qr "../google-country-$VERSION.zip" .)

      # Two signed crx (only when a signing key is configured), both signed with the same key:
      #  - cws-upload.crx: NO update_url, for the Verified CRX upload to the Web Store (store-managed
      #    updates). Built first, from the clean dist.
      #  - google-country-<version>.crx (+ updates.xml): WITH update_url, for the GitHub release +
      #    Pages so self-hosted/Kiwi installs auto-update. Built second (it mutates dist's manifest).
      - name: Sign crx variants
        if: env.CRX_PRIVATE_KEY != ''
        run: |
          printf '%s' "$CRX_PRIVATE_KEY" > key.pem
          node scripts/pack-crx.mjs --key key.pem --no-update --out cws-upload.crx
          crx_url="https://jmerhar.github.io/${GITHUB_REPOSITORY#*/}/google-country.crx"
          node scripts/pack-crx.mjs --key key.pem --url "$crx_url"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          # Only the versioned self-hosted crx is attached; cws-upload.crx is store-only, and this
          # glob doesn't match it. Missing globs (no crx when the key is absent) are skipped.
          files: |
            google-country-*.zip
            google-country-*.crx
            updates.xml

      # Chrome Web Store — uploads the signed store crx (no update_url) for Verified CRX uploads.
      # Non-fatal: the GitHub Release and Pages deploy have already succeeded, so a store-side issue
      # (auth, or the item locked while in review) is surfaced without failing the release.
      - name: Publish to Chrome Web Store
        if: env.CWS_SERVICE_ACCOUNT_KEY != '' && env.CRX_PRIVATE_KEY != ''
        continue-on-error: true
        run: node scripts/cws-publish.mjs cws-upload.crx
