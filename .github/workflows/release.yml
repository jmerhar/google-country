name: Release

# Releases are cut from version tags only. (No workflow_dispatch: without a tag the GitHub Release
# step has no tag to publish and would fail.)
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and push the Pages branch
    # Secrets mapped to env so the optional steps can guard on presence (skip, not fail, when unset).
    env:
      CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
      CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # The tag must match the package version so the artifacts are labelled correctly.
      - name: Verify tag matches version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          test "$tag" = "$VERSION" || { echo "Tag v$tag != package.json $VERSION"; exit 1; }

      # Release notes come from the CHANGELOG section for this version (fails if missing).
      - name: Extract release notes
        run: node scripts/release-notes.mjs "$VERSION" > RELEASE_NOTES.md

      # Don't publish a release from a red commit (the tag and CI run concurrently otherwise).
      - name: Lint, type-check & test
        run: |
          npm run lint
          npm run typecheck
          npm run test

      - name: Build extension
        run: npm run build

      - name: Package zip
        run: (cd dist && zip -qr "../google-country-$VERSION.zip" .)

      # .crx + updates.xml — only when a signing key is configured. The crx's stable auto-update URL
      # points at GitHub Pages; the Pages workflow serves the crx there (triggered by this release).
      - name: Sign .crx + updates.xml
        if: env.CRX_PRIVATE_KEY != ''
        run: |
          printf '%s' "$CRX_PRIVATE_KEY" > key.pem
          crx_url="https://jmerhar.github.io/${GITHUB_REPOSITORY#*/}/google-country.crx"
          node scripts/pack-crx.mjs --key key.pem --url "$crx_url"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          # Missing globs (e.g. no .crx when the key is absent) are skipped, not fatal.
          files: |
            google-country-*.zip
            google-country-*.crx
            updates.xml

      # Chrome Web Store — uploads the signed .crx (Verified CRX uploads). Needs the CWS service
      # account + item ID and the signing key (to produce the crx). Non-fatal: the GitHub Release and
      # Pages deploy have already succeeded by this point, so a store-side issue (auth, review state)
      # is surfaced as a failed step without marking the whole release red.
      - name: Publish to Chrome Web Store
        if: env.CWS_SERVICE_ACCOUNT_KEY != '' && env.CWS_EXTENSION_ID != '' && env.CRX_PRIVATE_KEY != ''
        continue-on-error: true
        run: node scripts/cws-publish.mjs "google-country-$VERSION.crx"
