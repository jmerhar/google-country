name: CI

on:
  # push is limited to main because pull_request already covers branch work: triggering on both would
  # run the whole suite twice for every pull request.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    # contents: read for checkout; statuses: write to link the published coverage report.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Lint & type-check
        run: |
          npm run lint
          npm run typecheck

      - name: Test with coverage
        run: npx vitest run --coverage

      # The suite, its label and its gate are declared in coverage.toml; the tooling behind this and
      # the two coverage steps below is shared by every project publishing to the coverage site.
      - uses: jmerhar/coverage/.github/actions/summary@v1

      # Informational, never fails the build.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

      # Runs after the Codecov upload so coverage still lands when the gate fails, and before
      # publishing so a regression never reaches the site.
      - uses: jmerhar/coverage/.github/actions/gate@v1

      - name: Build extension
        run: npm run build

      # Publish the HTML report to the shared coverage site and link it from the commit. Only on
      # green pushes to main; the action skips when the token is absent, so this stays green if the
      # secret is ever missing.
      - uses: jmerhar/coverage/.github/actions/publish@v1
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          token: ${{ secrets.COVERAGE_PAGES_TOKEN }}
