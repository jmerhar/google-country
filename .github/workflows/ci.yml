name: CI

# The suites in devtools.toml's [ci] section, run by jmerhar/devtools' shared workflow.
on:
  # push is limited to main because pull_request already covers branch work; triggering on both
  # would run everything twice for every pull request.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ci:
    uses: jmerhar/devtools/.github/workflows/python-docker-app.yml@v1
    with:
      fetcher: scripts/devtools-fetch.sh
    permissions:
      contents: write
      packages: write
      statuses: write
    secrets: inherit
