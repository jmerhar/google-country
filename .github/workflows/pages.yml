name: Pages

# Deploys the promotional site (home / privacy / support) to GitHub Pages, and bundles the latest
# release's downloads (zip, crx, updates.xml) so the direct links + auto-update URL stay current.
# Runs on content changes (push to main) and — crucially — after the Release workflow finishes, so
# it picks up the just-published version. (A release created by GITHUB_TOKEN does not fire the
# `release` event, so we depend on the Release run via workflow_run instead.) Pages source must be
# "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch: {}

# One concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # On a Release-triggered run, only deploy if the release actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run site

      # Serve the latest release's downloads from the site root under stable names, so the site can
      # link them directly (versioned release-asset names have no stable "latest" URL). Ignored on
      # the very first deploy if no release exists yet.
      - name: Add release downloads (zip, crx, updates.xml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --pattern '*.crx' --pattern '*.zip' --pattern 'updates.xml' -D site-dist || echo "no release assets yet"
          for ext in crx zip; do
            if ls site-dist/google-country-*.$ext >/dev/null 2>&1; then
              mv site-dist/google-country-*.$ext site-dist/google-country.$ext
            fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
