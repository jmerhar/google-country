name: Pages

# The promo, privacy and support site, with the latest release's downloads (scripts/build-site.sh),
# deployed by jmerhar/devtools' shared Pages workflow; again after each successful release, so the
# downloads are current.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pages:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: jmerhar/devtools/.github/workflows/pages-deploy.yml@v1
    with:
      node: "22"
      install: npm ci
      build: scripts/build-site.sh
      path: site-dist
      fetcher: scripts/devtools-fetch.sh
    permissions:
      contents: read
      pages: write
      id-token: write
